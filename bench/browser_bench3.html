<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fm3 browser bench</title>
<style>
  :root { --bg: #fff; --fg: #1a1a1a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #e8e8e8; } }
  body { background: var(--bg); color: var(--fg); font: 14px/1.4 ui-monospace, monospace; margin: 16px; }
</style>
</head>
<body>
<h1>fm3: JS vs BPL→WebAssembly (browser)</h1>
<pre id="out">running…</pre>
<script type="module">
import * as js from "../js/fm3core.mjs";
import { loadFm3Wasm } from "../bpl/fm3wasm.mjs";

const out = document.getElementById("out");
const lines = [];
const log = (s) => { lines.push(s); out.textContent = lines.join("\n"); };
window.benchResults = [];
const sets = [
  ["text_1mb", "bytes", 0, "../testdata/text_1mb.bin"],
  ["noah", "image", 320, "../testdata/thumbref_noah.rgb"],
  ["library", "image", 512, "../testdata/style_win_library.rgb"],
  ["A_original", "image", 2048, "../testdata/thumbnail-A-original.rgb"],
];
const levels = (new URLSearchParams(location.search).get("levels") || "1,3,4").split(",").map(Number);
const eq = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
const time = (f) => { const t = performance.now(); const r = f(); return [r, (performance.now() - t) / 1000]; };
const tick = () => new Promise((r) => setTimeout(r, 0));

try {
  const wasm = await loadFm3Wasm(await fetch("../bpl/fm3.wasm"));
  log(navigator.userAgent);
  log("data        lvl   ratio   js_enc  js_dec  wasm_enc wasm_dec  check");
  for (const [name, mode, width, path] of sets) {
    const data = new Uint8Array(await (await fetch(path)).arrayBuffer());
    for (const level of levels) {
      await tick();
      const [je, jet] = time(() => js.encode(data, { level, mode, width }));
      const [jd, jdt] = time(() => js.decode(je));
      const [we, wet] = time(() => wasm.encode(data, { level, mode, width }));
      const [wd, wdt] = time(() => wasm.decode(we));
      const ok = eq(je, we) && eq(jd, data) && eq(wd, data);
      const r = { name, level, ratio: we.length / data.length, jet, jdt, wet, wdt, ok, mb: data.length / 1e6 };
      window.benchResults.push(r);
      log(`${name.padEnd(11)} L${level}  ${r.ratio.toFixed(4)}  ${jet.toFixed(2).padStart(6)}  ${jdt.toFixed(2).padStart(6)}  ${wet.toFixed(2).padStart(8)} ${wdt.toFixed(2).padStart(8)}  ${ok ? "identical+roundtrip" : "MISMATCH"}`);
    }
  }
  log("DONE");
} catch (e) {
  log("ERROR " + (e && e.stack || e));
}
</script>
</body>
</html>
