name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: make c/fm4 CFLAGS="-O2 -Wall"
      - run: make test
  # Apple Silicon: a second OS and CPU architecture; tests/expected.txt must match bit for bit
  macos-arm64:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: make c/fm4 CFLAGS="-O2 -Wall"
      - run: tests/run.sh
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make python diffutils
      - run: make c/fm4 CC=gcc CFLAGS="-O2 -Wall"
      - run: tests/run.sh
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: make sanitize
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: make c/fm4 CFLAGS="-O2 -Wall"
      - run: OUT=$RUNNER_TEMP/fuzz FUZZ_SECONDS=120 tests/fuzz/run.sh
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashes
          path: ${{ runner.temp }}/fuzz/crash_*
